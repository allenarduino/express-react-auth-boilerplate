services:
  # PostgreSQL Database
  db:
    image: postgres:16
    container_name: express-react-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: express_react_auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d express_react_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Service
  # Note: Create a .env file in the backend directory using env.example as a template
  # to set your JWT_SECRET, RESEND_API_KEY, and EMAIL_FROM values
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express-react-auth-backend
    restart: unless-stopped
    ports:
      - "4001:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://app_user:app_password@db:5432/express_react_auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - EMAIL_PROVIDER=resend
      - RESEND_API_KEY=${RESEND_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_FROM=${EMAIL_FROM}
      - APP_URL=http://localhost:4001
      - FRONTEND_URL=http://localhost:5173
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "dev"]

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: express-react-auth-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:4001
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host"]

volumes:
  postgres_data:
